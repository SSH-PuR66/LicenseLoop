<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LicenseLoop{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-extrabold tracking-tight">License<span
                    class="text-indigo-600">Loop</span></a>
            <div class="flex items-center gap-4">
                {% block nav %}
                <a href="/login" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Log in</a>
                <a href="/signup"
                    class="text-sm font-semibold bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Start
                    free</a>
                {% endblock %}
            </div>
        </div>
    </nav>
    <main class="flex-1">{% block content %}{% endblock %}</main>
    <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        © 2026 LicenseLoop · Never miss a renewal again.
    </footer>
</body>

</html>
